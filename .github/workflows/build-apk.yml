name: Build ClinicalWatch APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build phone and watch debug APKs
        run: gradle :app:assembleDebug :phone:assembleDebug
      - name: Upload Watch APK
        uses: actions/upload-artifact@v4
        with:
          name: ClinicalWatch-Watch
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Phone Companion APK
        uses: actions/upload-artifact@v4
        with:
          name: ClinicalWatch-Companion
          path: phone/build/outputs/apk/debug/phone-debug.apk
